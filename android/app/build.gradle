plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.reciclamx_ai"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.reciclamex_ai"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        //appName = "mySmartRecycling"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug

            //More clean my code and deployment app            
            minifyEnabled true
            //When a resource not used erase
            shrinkResources true

            //wrtite apk in build/app/outputs/release
            // android.applicationVariants.all { variant ->
            //     variant.outputs.all {                  
            //         outputFileName = "${appName}_${variant.versionName}.apk"
            //     }
            // }


        }
    }   
}

flutter {
    source = "../.."
}

dependencies {    
    implementation 'com.github.bumptech.glide:glide:4.12.0'    
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'   
     implementation 'com.squareup.retrofit2:retrofit:2.9.0'    
     implementation 'com.squareup.okhttp3:okhttp:4.9.0'
}